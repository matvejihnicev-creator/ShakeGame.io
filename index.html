<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Змейка • Онлайн таблица лидеров</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #1a2f28 0%, #1e3a2f 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
      padding: 20px;
      margin: 0;
    }

    .game-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .main-layout {
      display: flex;
      gap: 2rem;
      align-items: flex-start;
      flex-wrap: wrap;
      justify-content: center;
    }

    .game-container {
      background: #0f2219;
      border-radius: 2.5rem;
      padding: 2rem 2rem 1.8rem;
      box-shadow: 0 30px 45px rgba(0, 0, 0, 0.7), inset 0 0 15px rgba(80, 140, 100, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid #3a5a40;
      position: relative;
    }

    canvas {
      display: block;
      border-radius: 1.8rem;
      background: #0b1b12;
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9), 0 20px 30px rgba(0, 0, 0, 0.8);
      border: 2px solid #4a6b4a;
      width: 100%;
      height: auto;
      max-width: 500px;
      aspect-ratio: 1 / 1;
    }

    .info-panel {
      width: 100%;
      margin-top: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 1.2rem 1.8rem;
      background: #1c3526;
      border-radius: 3rem;
      padding: 1rem 2rem;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.6), 0 10px 15px rgba(0,0,0,0.5);
      border: 1px solid #4f6b4a;
    }

    .score-block {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .score-item {
      background: #0a1810;
      padding: 0.5rem 1.5rem;
      border-radius: 2rem;
      text-align: center;
      box-shadow: inset 0 2px 6px black;
      color: #d4edc9;
    }

    .score-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      color: #96b98a;
    }

    .score-value {
      font-size: 2.2rem;
      font-weight: 700;
      line-height: 1.2;
      color: #f5ffdd;
      text-shadow: 0 0 10px #7bbf6a;
    }

    .color-picker {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      background: #0b1f14;
      padding: 0.4rem 1.2rem;
      border-radius: 2rem;
    }

    .color-picker label {
      color: #b9dbb0;
      font-weight: 500;
      font-size: 0.9rem;
      letter-spacing: 0.3px;
    }

    input[type="color"] {
      width: 38px;
      height: 38px;
      border: 2px solid #5e7a5e;
      border-radius: 50%;
      cursor: pointer;
      background: #2b4b2b;
      padding: 2px;
      box-shadow: 0 0 12px rgba(100, 200, 100, 0.7);
    }

    button {
      background: #f4c542;
      border: none;
      font-weight: bold;
      font-size: 1rem;
      padding: 0.6rem 1.8rem;
      border-radius: 2.5rem;
      letter-spacing: 0.5px;
      background: #e5b93c;
      color: #1d3320;
      box-shadow: 0 6px 0 #7a5d2c, 0 8px 18px black;
      cursor: pointer;
      transition: all 0.08s ease;
      border: 1px solid #ffd966;
      text-transform: uppercase;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #7a5d2c, 0 6px 12px black;
    }

    .leaderboard {
      background: #1c3526;
      border-radius: 2rem;
      padding: 1.5rem;
      border: 2px solid #4f6b4a;
      min-width: 300px;
      box-shadow: 0 15px 25px rgba(0,0,0,0.5);
    }

    .leaderboard h3 {
      color: #f7e05e;
      text-align: center;
      font-size: 1.3rem;
      margin-bottom: 0.5rem;
      text-shadow: 0 2px 5px black;
    }

    .leaderboard-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      justify-content: center;
    }

    .leaderboard-tab {
      padding: 0.4rem 1rem;
      font-size: 0.85rem;
      background: #0d1f15;
      border: 1px solid #4a6b4a;
      color: #b9dbb0;
      cursor: pointer;
      border-radius: 1rem;
      transition: all 0.2s;
    }

    .leaderboard-tab.active {
      background: #3a6b4a;
      color: #f5ffdd;
      border-color: #7bbf6a;
      box-shadow: 0 0 10px rgba(123, 191, 106, 0.3);
    }

    .leaderboard-list {
      list-style: none;
      color: #d4edc9;
    }

    .leaderboard-list li {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 0.8rem;
      border-bottom: 1px solid #2a4a2a;
      font-size: 0.95rem;
      gap: 1rem;
    }

    .leaderboard-list li:last-child {
      border-bottom: none;
    }

    .leaderboard-list .rank {
      color: #f7e05e;
      font-weight: bold;
      min-width: 30px;
    }

    .leaderboard-list .name {
      flex: 1;
      text-align: left;
    }

    .leaderboard-list .score {
      font-weight: bold;
      color: #ffd966;
    }

    .sync-status {
      text-align: center;
      font-size: 0.75rem;
      margin-top: 0.8rem;
    }

    .sync-ok {
      color: #7bbf6a;
    }

    .sync-error {
      color: #ff8a7a;
    }

    .sync-loading {
      color: #ffd966;
    }

    .nickname-display {
      background: #0a1810;
      padding: 0.3rem 1rem;
      border-radius: 1rem;
      color: #ffd966;
      font-weight: bold;
    }

    .menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      backdrop-filter: blur(6px);
    }

    .menu-panel {
      background: #1e3a2f;
      border: 2px solid #5e8c5e;
      border-radius: 3rem;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.8);
      min-width: 380px;
      max-width: 450px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .menu-panel h2 {
      color: #f7e05e;
      font-size: 2.4rem;
      margin-bottom: 1rem;
      text-shadow: 0 4px 10px black;
    }

    .menu-subtitle {
      color: #b9dbb0;
      font-size: 1rem;
      margin-bottom: 1.5rem;
    }

    .menu-buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      width: 100%;
    }

    .menu-btn {
      margin: 0;
      padding: 0.9rem 2rem;
      font-size: 1.2rem;
      width: 80%;
    }

    .settings-group {
      background: #152b1f;
      border-radius: 2rem;
      padding: 1.5rem;
      margin: 1rem 0;
      text-align: left;
      width: 100%;
      max-height: 50vh;
      overflow-y: auto;
    }

    .settings-group label {
      color: #cfebc3;
      font-weight: 600;
      display: block;
      margin: 0.8rem 0 0.3rem;
      font-size: 0.9rem;
    }

    select, input[type="range"], input[type="text"], input[type="file"] {
      width: 100%;
      padding: 0.6rem;
      border-radius: 1.5rem;
      background: #0d1f15;
      border: 1px solid #5b7e5b;
      color: #e0f0d8;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    input[type="file"] {
      padding: 0.4rem;
      font-size: 0.85rem;
    }

    .preview-btn {
      background: #4a7a5a;
      color: #e0f0d8;
      box-shadow: 0 4px 0 #2a4a2a;
      font-size: 0.85rem;
      padding: 0.4rem 1.2rem;
      margin-top: 0.3rem;
      width: auto;
    }

    .nickname-section {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .nickname-section input {
      flex: 1;
      margin-bottom: 0;
    }

    .nickname-section button {
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .error-msg {
      color: #ff8a7a;
      font-size: 0.8rem;
      margin-top: -0.3rem;
      margin-bottom: 0.5rem;
    }

    .hidden {
      display: none !important;
    }

    .controls-hint {
      color: #b9cfaa;
      margin-top: 0.7rem;
      font-size: 0.9rem;
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .pause-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 1.8rem;
      cursor: pointer;
      z-index: 10;
    }

    .pause-text {
      font-size: 3rem;
      font-weight: bold;
      color: #f7e05e;
      text-shadow: 0 0 20px rgba(247, 224, 94, 0.5);
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    @media (max-width: 800px) {
      .main-layout {
        flex-direction: column;
        align-items: center;
      }
      .leaderboard {
        width: 100%;
        max-width: 500px;
      }
    }

    @media (max-width: 500px) {
      .info-panel {
        flex-direction: column;
        gap: 1rem;
      }
      .score-block {
        gap: 1rem;
      }
      .menu-panel {
        min-width: 300px;
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>
<body>
<div class="game-wrapper">
  <div class="main-layout">
    <div class="game-container" id="gameContainer">
      <canvas id="gameCanvas" width="400" height="400"></canvas>
      <div class="pause-overlay hidden" id="pauseOverlay">
        <div class="pause-text">⏸ ПАУЗА</div>
      </div>

      <div class="info-panel">
        <div class="score-block">
          <div class="score-item">
            <div class="score-label" id="currentScoreLabel">🍎 Текущий</div>
            <div class="score-value" id="currentScoreDisplay">0</div>
          </div>
          <div class="score-item">
            <div class="score-label" id="highScoreLabel">🏆 Общий рекорд</div>
            <div class="score-value" id="highScoreDisplay">0</div>
          </div>
        </div>

        <div class="color-picker">
          <label for="snakeColorPicker" id="colorLabel">🐍 Цвет</label>
          <input type="color" id="snakeColorPicker" value="#6fbf4c">
        </div>

        <button id="restartButton">
          <span>↺</span> <span id="restartText">Новая игра</span>
        </button>
      </div>
      <div class="controls-hint">
        <span>⬆⬇⬅➡ / WASD / ЦФЫВ</span>
        <span>Esc - пауза</span>
        <span id="gameStatus" style="color:#f7da7c;">▶ Игра идёт</span>
        <span class="nickname-display" id="nicknameDisplay"></span>
      </div>
    </div>

    <div class="leaderboard" id="leaderboardPanel">
      <h3 id="leaderboardTitle">🏆 ОНЛАЙН ТАБЛИЦА</h3>
      <div class="leaderboard-tabs">
        <button class="leaderboard-tab active" data-size="10">10×10</button>
        <button class="leaderboard-tab" data-size="20">20×20</button>
      </div>
      <ul class="leaderboard-list" id="leaderboardList">
        <li><span class="rank">-</span><span class="name">Загрузка...</span><span class="score">-</span></li>
      </ul>
      <div class="sync-status sync-loading" id="syncStatus">🔄 Подключение к серверу...</div>
    </div>
  </div>

  <div id="mainMenu" class="menu-overlay">
    <div class="menu-panel">
      <h2>🐍 <span id="menuTitle">ЗМЕЙКА</span></h2>
      <div class="menu-buttons">
        <button id="playButton" class="menu-btn">▶ <span id="playText">ИГРАТЬ</span></button>
        <button id="settingsButton" class="menu-btn">⚙ <span id="settingsText">НАСТРОЙКИ</span></button>
      </div>
    </div>
  </div>

  <div id="pauseMenu" class="menu-overlay hidden">
    <div class="menu-panel">
      <h2>⏸ <span id="pauseTitle">ПАУЗА</span></h2>
      <div class="menu-subtitle" id="pauseSubtitle">Игра приостановлена</div>
      <div class="settings-group">
        <label id="pauseNicknameLabel">👤 Никнейм</label>
        <div class="nickname-section">
          <input type="text" id="pauseNicknameInput" placeholder="Введите никнейм" maxlength="15" autocomplete="off">
          <button id="pauseSaveNicknameBtn">✓</button>
        </div>
        <div class="error-msg hidden" id="pauseNicknameError"></div>

        <label for="pauseSnakeStyleSelect" id="pauseSnakeStyleLabel">🐍 Стиль змейки</label>
        <select id="pauseSnakeStyleSelect">
          <option value="0">Круглая</option>
          <option value="1">Квадратная</option>
        </select>

        <label for="pauseSoundSelect" id="pauseSoundLabel">🔊 Звук сбора</label>
        <select id="pauseSoundSelect">
          <option value="0">Классический</option>
          <option value="1">Весёлый день</option>
          <option value="2">Глубокий хлопок</option>
        </select>
        <button id="pausePreviewSound" class="preview-btn">▶ Прослушать</button>

        <label for="pauseVolumeSlider">🔈 <span id="pauseVolumeLabel">Громкость</span>: <span id="pauseVolumeValue">70</span>%</label>
        <input type="range" id="pauseVolumeSlider" min="0" max="100" value="70">

        <label for="pauseFruitSelect" id="pauseFruitLabel">🍎 Фрукт</label>
        <select id="pauseFruitSelect">
          <option value="0">Яблоко</option>
          <option value="1">Банан</option>
          <option value="2">Слива</option>
        </select>

        <label for="pauseFieldDesignSelect" id="pauseFieldDesignLabel">🎨 Дизайн поля</label>
        <select id="pauseFieldDesignSelect">
          <option value="0">Классический тёмный</option>
          <option value="1">Лесной</option>
          <option value="2">Пустынный</option>
          <option value="3">Зимний</option>
          <option value="4">Свой фон</option>
        </select>
        <input type="file" id="pauseCustomBgInput" accept="image/*">

        <label for="pauseGridSizeSelect" id="pauseGridSizeLabel">📐 Размер поля</label>
        <select id="pauseGridSizeSelect">
          <option value="10">10x10</option>
          <option value="20" selected>20x20</option>
        </select>

        <label for="pauseLanguageSelect" id="pauseLanguageLabel">🌐 Язык</label>
        <select id="pauseLanguageSelect">
          <option value="ru">Русский</option>
          <option value="en">English</option>
        </select>
      </div>
      <div class="menu-buttons">
        <button id="resumeButton" class="menu-btn">▶ <span id="resumeText">ПРОДОЛЖИТЬ</span></button>
        <button id="pauseRestartButton" class="menu-btn">↺ <span id="pauseRestartText">НОВАЯ ИГРА</span></button>
        <button id="pauseMainMenuButton" class="menu-btn">🏠 <span id="pauseMainMenuText">ГЛАВНОЕ МЕНЮ</span></button>
      </div>
    </div>
  </div>

  <div id="settingsMenu" class="menu-overlay hidden">
    <div class="menu-panel">
      <h2>⚙ <span id="settingsTitle">НАСТРОЙКИ</span></h2>
      <div class="settings-group">
        <label id="nicknameLabel">👤 Никнейм</label>
        <div class="nickname-section">
          <input type="text" id="nicknameInput" placeholder="Введите никнейм" maxlength="15" autocomplete="off">
          <button id="saveNicknameBtn">✓</button>
        </div>
        <div class="error-msg hidden" id="nicknameError"></div>

        <label for="snakeStyleSelect" id="snakeStyleLabel">🐍 Стиль змейки</label>
        <select id="snakeStyleSelect">
          <option value="0">Круглая</option>
          <option value="1">Квадратная</option>
        </select>

        <label for="soundSelect" id="soundLabel">🔊 Звук сбора</label>
        <select id="soundSelect">
          <option value="0">Классический</option>
          <option value="1">Весёлый день</option>
          <option value="2">Глубокий хлопок</option>
        </select>
        <button id="previewSound" class="preview-btn">▶ Прослушать</button>

        <label for="volumeSlider">🔈 <span id="volumeLabel">Громкость</span>: <span id="volumeValue">70</span>%</label>
        <input type="range" id="volumeSlider" min="0" max="100" value="70">

        <label for="fruitSelect" id="fruitLabel">🍎 Фрукт</label>
        <select id="fruitSelect">
          <option value="0">Яблоко</option>
          <option value="1">Банан</option>
          <option value="2">Слива</option>
        </select>

        <label for="fieldDesignSelect" id="fieldDesignLabel">🎨 Дизайн поля</label>
        <select id="fieldDesignSelect">
          <option value="0">Классический тёмный</option>
          <option value="1">Лесной</option>
          <option value="2">Пустынный</option>
          <option value="3">Зимний</option>
          <option value="4">Свой фон</option>
        </select>
        <input type="file" id="customBgInput" accept="image/*">

        <label for="gridSizeSelect" id="gridSizeLabel">📐 Размер поля</label>
        <select id="gridSizeSelect">
          <option value="10">10x10</option>
          <option value="20" selected>20x20</option>
        </select>

        <label for="languageSelect" id="languageLabel">🌐 Язык</label>
        <select id="languageSelect">
          <option value="ru">Русский</option>
          <option value="en">English</option>
        </select>
      </div>
      <button id="backFromSettings" class="menu-btn">↩ <span id="backText">НАЗАД</span></button>
    </div>
  </div>
</div>

<script>
  (function() {
    const JSONBIN_API_KEY = '$2a$10$uCtxUi53PKP7TgaD9hxj8.a9mu25dVgjJrmAZjXflXT6I2Hi1D2Ci';
    const JSONBIN_BIN_ID = '6a64dabd3919920ec4854d0c';
    const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;
    
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const currentScoreSpan = document.getElementById('currentScoreDisplay');
    const highScoreSpan = document.getElementById('highScoreDisplay');
    const snakeColorPicker = document.getElementById('snakeColorPicker');
    const restartBtn = document.getElementById('restartButton');
    const gameStatusDiv = document.getElementById('gameStatus');
    const nicknameDisplay = document.getElementById('nicknameDisplay');
    const leaderboardList = document.getElementById('leaderboardList');
    const syncStatus = document.getElementById('syncStatus');
    const pauseOverlay = document.getElementById('pauseOverlay');

    const mainMenu = document.getElementById('mainMenu');
    const settingsMenu = document.getElementById('settingsMenu');
    const pauseMenu = document.getElementById('pauseMenu');
    const playButton = document.getElementById('playButton');
    const settingsButton = document.getElementById('settingsButton');
    const backFromSettings = document.getElementById('backFromSettings');
    const resumeButton = document.getElementById('resumeButton');
    const pauseRestartButton = document.getElementById('pauseRestartButton');
    const pauseMainMenuButton = document.getElementById('pauseMainMenuButton');

    const snakeStyleSelect = document.getElementById('snakeStyleSelect');
    const soundSelect = document.getElementById('soundSelect');
    const volumeSlider = document.getElementById('volumeSlider');
    const volumeValue = document.getElementById('volumeValue');
    const previewSoundBtn = document.getElementById('previewSound');
    const fruitSelect = document.getElementById('fruitSelect');
    const fieldDesignSelect = document.getElementById('fieldDesignSelect');
    const customBgInput = document.getElementById('customBgInput');
    const gridSizeSelect = document.getElementById('gridSizeSelect');
    const languageSelect = document.getElementById('languageSelect');
    const nicknameInput = document.getElementById('nicknameInput');
    const saveNicknameBtn = document.getElementById('saveNicknameBtn');
    const nicknameError = document.getElementById('nicknameError');

    const pauseSnakeStyleSelect = document.getElementById('pauseSnakeStyleSelect');
    const pauseSoundSelect = document.getElementById('pauseSoundSelect');
    const pauseVolumeSlider = document.getElementById('pauseVolumeSlider');
    const pauseVolumeValue = document.getElementById('pauseVolumeValue');
    const pausePreviewSound = document.getElementById('pausePreviewSound');
    const pauseFruitSelect = document.getElementById('pauseFruitSelect');
    const pauseFieldDesignSelect = document.getElementById('pauseFieldDesignSelect');
    const pauseCustomBgInput = document.getElementById('pauseCustomBgInput');
    const pauseGridSizeSelect = document.getElementById('pauseGridSizeSelect');
    const pauseLanguageSelect = document.getElementById('pauseLanguageSelect');
    const pauseNicknameInput = document.getElementById('pauseNicknameInput');
    const pauseSaveNicknameBtn = document.getElementById('pauseSaveNicknameBtn');
    const pauseNicknameError = document.getElementById('pauseNicknameError');

    // ==================== ОБЛАЧНЫЙ ЛИДЕРБОРД ====================
    let leaderboard = { '10': [], '20': [] };
    let currentLeaderboardSize = '20';
    let lastSyncTime = 0;
    const SYNC_INTERVAL = 5000;
    let isOnline = false;

    function getDeviceId() {
      let deviceId = localStorage.getItem('snakeDeviceId');
      if (!deviceId) {
        deviceId = 'device_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
        localStorage.setItem('snakeDeviceId', deviceId);
      }
      return deviceId;
    }

    const deviceId = getDeviceId();

    async function loadLeaderboardFromCloud() {
      try {
        syncStatus.textContent = '🔄 Синхронизация...';
        syncStatus.className = 'sync-status sync-loading';
        
        const response = await fetch(`${JSONBIN_URL}/latest`, {
          method: 'GET',
          headers: { 
            'X-Access-Key': JSONBIN_API_KEY
          }
        });
        
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const data = await response.json();
        
        if (data && data.record && data.record.leaderboard) {
          leaderboard = data.record.leaderboard;
          lastSyncTime = Date.now();
          isOnline = true;
          updateLeaderboardUI();
          syncStatus.textContent = '✅ Онлайн • Данные синхронизированы';
          syncStatus.className = 'sync-status sync-ok';
          localStorage.setItem('snakeLocalLeaderboard', JSON.stringify(leaderboard));
          return true;
        } else {
          throw new Error('Неверная структура данных');
        }
      } catch (e) {
        console.warn('Ошибка загрузки:', e.message);
        isOnline = false;
        const saved = localStorage.getItem('snakeLocalLeaderboard');
        if (saved) {
          try { leaderboard = JSON.parse(saved); } catch (parseError) { leaderboard = { '10': [], '20': [] }; }
        }
        updateLeaderboardUI();
        syncStatus.textContent = leaderboard['10'].length > 0 || leaderboard['20'].length > 0 ? '⚠️ Офлайн • Локальные данные' : '⚠️ Офлайн • Нет данных';
        syncStatus.className = 'sync-status sync-error';
        return false;
      }
    }

    async function saveLeaderboardToCloud() {
      try {
        syncStatus.textContent = '📤 Сохранение...';
        syncStatus.className = 'sync-status sync-loading';
        
        const response = await fetch(JSONBIN_URL, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Access-Key': JSONBIN_API_KEY
          },
          body: JSON.stringify({ leaderboard })
        });
        
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        lastSyncTime = Date.now();
        isOnline = true;
        syncStatus.textContent = '✅ Онлайн • Сохранено в облаке';
        syncStatus.className = 'sync-status sync-ok';
        localStorage.setItem('snakeLocalLeaderboard', JSON.stringify(leaderboard));
        return true;
      } catch (e) {
        console.warn('Ошибка сохранения:', e.message);
        localStorage.setItem('snakeLocalLeaderboard', JSON.stringify(leaderboard));
        syncStatus.textContent = '⚠️ Сохранено локально';
        syncStatus.className = 'sync-status sync-error';
        return false;
      }
    }

    async function addToLeaderboard(nickname, score, gridSize) {
      if (!nickname || score === 0) return;
      await loadLeaderboardFromCloud();
      const sizeKey = gridSize.toString();
      if (!leaderboard[sizeKey]) leaderboard[sizeKey] = [];
      const board = leaderboard[sizeKey];
      const existingIndex = board.findIndex(e => e.nickname === nickname);
      if (existingIndex >= 0) {
        if (score > board[existingIndex].score) {
          board[existingIndex].score = score;
          board[existingIndex].deviceId = deviceId;
          board[existingIndex].timestamp = Date.now();
        }
      } else {
        board.push({ nickname, score, deviceId, timestamp: Date.now() });
      }
      board.sort((a, b) => b.score - a.score);
      leaderboard[sizeKey] = board.slice(0, 50);
      updateLeaderboardUI();
      await saveLeaderboardToCloud();
    }

    function initAudio() {

    }

    function playAppleSound() {
      if (!audioCtx || soundVolume === 0) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime, vol = soundVolume;
      if (currentSoundType === 0) {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'sawtooth'; o.frequency.setValueAtTime(800, now); o.frequency.exponentialRampToValueAtTime(200, now + 0.15);
        g.gain.setValueAtTime(vol * 0.3, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        o.connect(g); g.connect(audioCtx.destination); o.start(now); o.stop(now + 0.2);
      } else if (currentSoundType === 1) {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.setValueAtTime(1200, now); o.frequency.setValueAtTime(1600, now + 0.08);
        g.gain.setValueAtTime(vol * 0.4, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        o.connect(g); g.connect(audioCtx.destination); o.start(now); o.stop(now + 0.25);
      } else {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'triangle'; o.frequency.setValueAtTime(300, now); o.frequency.exponentialRampToValueAtTime(80, now + 0.2);
        g.gain.setValueAtTime(vol * 0.5, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        o.connect(g); g.connect(audioCtx.destination); o.start(now); o.stop(now + 0.3);
      }
    }

    function playGameOverSound() {
      if (!audioCtx || soundVolume === 0) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime, vol = soundVolume;
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sawtooth'; o.frequency.setValueAtTime(400, now); o.frequency.exponentialRampToValueAtTime(100, now + 0.5);
      g.gain.setValueAtTime(vol * 0.3, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
      o.connect(g); g.connect(audioCtx.destination); o.start(now); o.stop(now + 0.6);
    }

    function playWinSound() {
      if (!audioCtx || soundVolume === 0) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime, vol = soundVolume;
      [523, 659, 784, 1047].forEach((f, i) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.setValueAtTime(f, now + i * 0.15);
        g.gain.setValueAtTime(vol * 0.3, now + i * 0.15); g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.15 + 0.3);
        o.connect(g); g.connect(audioCtx.destination); o.start(now + i * 0.15); o.stop(now + i * 0.15 + 0.3);
      });
    }

    function getInitSnake() {
      const m = Math.floor(GRID_SIZE / 2);
      return [{x: m, y: m}, {x: m-1, y: m}, {x: m-2, y: m}];
    }

    function generateRandomFood() {
      for (let a = 0; a < 2000; a++) {
        const x = Math.floor(Math.random() * GRID_SIZE), y = Math.floor(Math.random() * GRID_SIZE);
        if (!snake.some(s => s.x === x && s.y === y)) { food = {x, y}; return true; }
      }
      return false;
    }

    function checkCollision(h, b) {
      if (h.x < 0 || h.x >= GRID_SIZE || h.y < 0 || h.y >= GRID_SIZE) return true;
      return b.some(s => s.x === h.x && s.y === h.y);
    }

    function moveSnake() {
      if (!gameActive || isPaused) return;
      prevSnake = snake.map(s => ({...s}));
      direction = {...nextDirection};
      const head = snake[0];
      const nh = {x: head.x + direction.x, y: head.y + direction.y};
      const fe = (nh.x === food.x && nh.y === food.y);
      let ns = fe ? [nh, ...snake] : [nh, ...snake.slice(0, -1)];
      const bc = ns.slice(1);
      if (checkCollision(nh, bc)) {
        gameActive = false; gameOverFlag = true; winFlag = false;
        updateGameStatus(); clearGameLoop();
        saveHighScore(currentScore);
        addToLeaderboard(playerNickname, currentScore, GRID_SIZE);
        playGameOverSound(); animationProgress = 1; drawBoard(); return;
      }
      snake = ns;
      if (fe) {
        currentScore++;
        currentScoreSpan.textContent = currentScore;
        saveHighScore(currentScore);
        playAppleSound();
        prevSnake = [prevSnake[0], ...prevSnake];
        if (!generateRandomFood()) {
          gameActive = false; gameOverFlag = false; winFlag = true;
          updateGameStatus(); clearGameLoop();
          saveHighScore(currentScore);
          addToLeaderboard(playerNickname, currentScore, GRID_SIZE);
          playWinSound(); animationProgress = 1; drawBoard(); return;
        }
      }
      animationProgress = 0;
      lastMoveTime = performance.now();
      drawBoard();
    }

    function startGameLoop() {
      if (gameLoopInterval) clearInterval(gameLoopInterval);
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      if (gameActive && !isPaused) {
        gameLoopInterval = setInterval(moveSnake, MOVE_INTERVAL_MS);
        animationFrameId = requestAnimationFrame(animateLoop);
      }
    }

    function clearGameLoop() {
      if (gameLoopInterval) { clearInterval(gameLoopInterval); gameLoopInterval = null; }
      if (animationFrameId) { cancelAnimationFrame(animationFrameId); animationFrameId = null; }
    }

    function animateLoop(ts) {
      if (!gameActive || isPaused) { animationFrameId = null; return; }
      animationProgress = Math.min(1, (ts - lastMoveTime) / MOVE_INTERVAL_MS);
      drawBoard(); animationFrameId = requestAnimationFrame(animateLoop);

    function handleKeyDown(e) {
      const key = e.key, code = e.code;
      if (document.activeElement === nicknameInput || document.activeElement === pauseNicknameInput) {
        if (key === 'Escape' || code === 'Escape') {
          e.preventDefault();
          if (!pauseMenu.classList.contains('hidden')) resumeGame();
          else if (!settingsMenu.classList.contains('hidden')) { settingsMenu.classList.add('hidden'); mainMenu.classList.remove('hidden'); }
          else if (!mainMenu.classList.contains('hidden')) hideAllMenus();
        }
        return;
      }
      if (key === 'Escape' || code === 'Escape') {
        e.preventDefault();
        if (!pauseMenu.classList.contains('hidden')) { resumeGame(); return; }
        if (!settingsMenu.classList.contains('hidden')) { settingsMenu.classList.add('hidden'); mainMenu.classList.remove('hidden'); return; }
        if (!mainMenu.classList.contains('hidden')) { hideAllMenus(); return; }
        if (gameActive && !gameOverFlag && !winFlag) togglePause();
        else showMainMenu();
        return;
      }
      let nd = null;
      if (code === 'ArrowUp' || code === 'KeyW') nd = {x: 0, y: -1};
      else if (code === 'ArrowDown' || code === 'KeyS') nd = {x: 0, y: 1};
      else if (code === 'ArrowLeft' || code === 'KeyA') nd = {x: -1, y: 0};
      else if (code === 'ArrowRight' || code === 'KeyD') nd = {x: 1, y: 0};
      if (!nd) {
        if (key === 'ц' || key === 'Ц' || key === 'w' || key === 'W') nd = {x: 0, y: -1};
        else if (key === 'ы' || key === 'Ы' || key === 's' || key === 'S') nd = {x: 0, y: 1};
        else if (key === 'ф' || key === 'Ф' || key === 'a' || key === 'A') nd = {x: -1, y: 0};
        else if (key === 'в' || key === 'В' || key === 'd' || key === 'D') nd = {x: 1, y: 0};
      }
      if (nd) { e.preventDefault(); if (!gameActive || isPaused) return;
        if (direction.x === -nd.x && direction.y === -nd.y) return; nextDirection = nd; }
    }

    function drawFruit(fx, fy) {
      const s = CELL_SIZE / 2.5;
      ctx.shadowColor = '#ff7b6b'; ctx.shadowBlur = 10;
      if (fruitType === 0) {
        ctx.fillStyle = '#e8453c'; ctx.beginPath(); ctx.arc(fx+CELL_SIZE/2, fy+CELL_SIZE/2, s, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#8bc34a'; ctx.shadowBlur = 6;
        ctx.beginPath(); ctx.ellipse(fx+CELL_SIZE/1.8, fy+CELL_SIZE/3.5, CELL_SIZE/8, CELL_SIZE/5.5, 0.4, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#5d8233'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(fx+CELL_SIZE/1.9, fy+CELL_SIZE/3.2); ctx.lineTo(fx+CELL_SIZE/1.55, fy+CELL_SIZE/4.5); ctx.stroke();
      } else if (fruitType === 1) {
        ctx.fillStyle = '#f4e542'; ctx.beginPath(); ctx.ellipse(fx+CELL_SIZE/2, fy+CELL_SIZE/2.3, s*1.2, s*0.6, -0.3, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#8b7355'; ctx.beginPath(); ctx.arc(fx+CELL_SIZE/3.5, fy+CELL_SIZE/3, s*0.3, 0, Math.PI*2); ctx.fill();
      } else {
        ctx.fillStyle = '#8e44ad'; ctx.beginPath(); ctx.arc(fx+CELL_SIZE/2, fy+CELL_SIZE/2, s, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#6c3483'; ctx.beginPath(); ctx.arc(fx+CELL_SIZE/2.5, fy+CELL_SIZE/2.5, s*0.3, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#5d8233'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(fx+CELL_SIZE/2, fy+CELL_SIZE/3.5); ctx.lineTo(fx+CELL_SIZE/1.8, fy+CELL_SIZE/5); ctx.stroke();
      }
    }

    function drawSnakeSegment(x, y, radius, isHead) {
      if (snakeStyle === 0) {
        const gradient = ctx.createRadialGradient(x + 4, y + 4, 2, x + CELL_SIZE/2, y + CELL_SIZE/2, CELL_SIZE/1.5);
        gradient.addColorStop(0, snakeColor);
        gradient.addColorStop(0.7, '#1e3b1a');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(x + CELL_SIZE/2, y + CELL_SIZE/2, radius, 0, 2 * Math.PI);
        ctx.fill();
      } else {
        const padding = CELL_SIZE * 0.15;
        ctx.fillStyle = snakeColor;
        ctx.fillRect(x + padding, y + padding, CELL_SIZE - padding * 2, CELL_SIZE - padding * 2);
        ctx.strokeStyle = '#1e3b1a';
        ctx.lineWidth = 2;
        ctx.strokeRect(x + padding, y + padding, CELL_SIZE - padding * 2, CELL_SIZE - padding * 2);
      }

      if (isHead && CELL_SIZE > 10) {
        const eyeOffset = CELL_SIZE / 6;
        ctx.fillStyle = 'white';
        ctx.beginPath();
        ctx.arc(x + CELL_SIZE/1.7, y + CELL_SIZE/3, eyeOffset, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x + CELL_SIZE/2.5, y + CELL_SIZE/3, eyeOffset, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#0a0f0a';
        ctx.beginPath();
        ctx.arc(x + CELL_SIZE/1.7 + eyeOffset/3, y + CELL_SIZE/3 - eyeOffset/3, eyeOffset/2, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x + CELL_SIZE/2.5 + eyeOffset/3, y + CELL_SIZE/3 - eyeOffset/3, eyeOffset/2, 0, Math.PI*2);
        ctx.fill();
      }
    }

    function drawBoard() {
      const d = fieldDesigns[fieldDesign];
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (fieldDesign === 4 && customBgImage) ctx.drawImage(customBgImage, 0, 0, canvas.width, canvas.height);
      else { ctx.fillStyle = d.bg; ctx.fillRect(0, 0, canvas.width, canvas.height); }
      ctx.strokeStyle = d.grid; ctx.lineWidth = 0.6;
      for (let i = 0; i <= GRID_SIZE; i++) {
        ctx.beginPath(); ctx.moveTo(i*CELL_SIZE, 0); ctx.lineTo(i*CELL_SIZE, canvas.height); ctx.stroke();
        ctx.moveTo(0, i*CELL_SIZE); ctx.lineTo(canvas.width, i*CELL_SIZE); ctx.stroke();
      }
      if (food) { const fx = food.x*CELL_SIZE, fy = food.y*CELL_SIZE; drawFruit(fx, fy); }
      ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
      const p = Math.min(1, Math.max(0, animationProgress));
      
      for (let i = snake.length - 1; i >= 0; i--) {
        const seg = snake[i];
        let dx = seg.x * CELL_SIZE;
        let dy = seg.y * CELL_SIZE;
        if (prevSnake[i] && p < 1 && gameActive && !isPaused) {
          dx = prevSnake[i].x * CELL_SIZE + (seg.x - prevSnake[i].x) * CELL_SIZE * p;
          dy = prevSnake[i].y * CELL_SIZE + (seg.y - prevSnake[i].y) * CELL_SIZE * p;
        }
        const radius = (CELL_SIZE/2) - (i === 0 ? CELL_SIZE/10 : CELL_SIZE/6);
        drawSnakeSegment(dx, dy, radius, i === 0);
      }

      if (!gameActive && !isPaused) {
        ctx.globalAlpha = 0.7; ctx.fillStyle = '#0a140e'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.globalAlpha = 1; ctx.font = 'bold 20px "Segoe UI", Inter'; ctx.fillStyle = '#f9e7b3';
        ctx.shadowColor = '#000'; ctx.shadowBlur = 14; ctx.textAlign = 'center';
        if (winFlag) ctx.fillText(t('win'), canvas.width/2, canvas.height/2-10);
        else if (gameOverFlag) ctx.fillText(t('gameOver'), canvas.width/2, canvas.height/2-10);
        ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
      }
    }

    function updateSnakeColor() { snakeColor = snakeColorPicker.value; drawBoard(); saveAllSettings(); }
    function updateNicknameDisplay() { nicknameDisplay.textContent = playerNickname || t('noNickname'); }

    function saveNickname() {
      const ie = document.activeElement === pauseNicknameInput ? pauseNicknameInput : nicknameInput;
      const ee = document.activeElement === pauseNicknameInput ? pauseNicknameError : nicknameError;
      const nn = ie.value.trim();
      if (!nn) { ee.textContent = ''; ee.classList.add('hidden'); return; }
      if (isNicknameTakenGlobally(nn) && nn.toLowerCase() !== playerNickname.toLowerCase()) {
        ee.textContent = t('nicknameTaken'); ee.classList.remove('hidden'); return;
      }
      ee.classList.add('hidden'); playerNickname = nn;
      updateNicknameDisplay(); ie.value = ''; saveAllSettings();
    }

    function showMainMenu() { mainMenu.classList.remove('hidden'); settingsMenu.classList.add('hidden'); pauseMenu.classList.add('hidden'); pauseOverlay.classList.add('hidden'); }
    function hideAllMenus() { mainMenu.classList.add('hidden'); settingsMenu.classList.add('hidden'); pauseMenu.classList.add('hidden'); }
    function showSettings() { mainMenu.classList.add('hidden'); settingsMenu.classList.remove('hidden'); pauseMenu.classList.add('hidden'); nicknameError.classList.add('hidden'); }

    function bindEvents() {
      window.addEventListener('keydown', handleKeyDown);
      restartBtn.addEventListener('click', resetGame);
      snakeColorPicker.addEventListener('input', updateSnakeColor);
      snakeColorPicker.addEventListener('change', updateSnakeColor);
      playButton.addEventListener('click', () => { initAudio(); if (!gameActive) resetGame(); else if (isPaused) resumeGame(); hideAllMenus(); });
      settingsButton.addEventListener('click', showSettings);
      backFromSettings.addEventListener('click', () => { settingsMenu.classList.add('hidden'); mainMenu.classList.remove('hidden'); });
      resumeButton.addEventListener('click', resumeGame);
      pauseRestartButton.addEventListener('click', restartFromPause);
      pauseMainMenuButton.addEventListener('click', goToMainMenu);

      snakeStyleSelect.addEventListener('change', (e) => { snakeStyle = parseInt(e.target.value, 10); pauseSnakeStyleSelect.value = snakeStyle; drawBoard(); saveAllSettings(); });
      soundSelect.addEventListener('change', (e) => { currentSoundType = parseInt(e.target.value, 10); pauseSoundSelect.value = currentSoundType; saveAllSettings(); });
      previewSoundBtn.addEventListener('click', () => { initAudio(); playAppleSound(); });
      volumeSlider.addEventListener('input', (e) => { soundVolume = parseInt(e.target.value, 10)/100; volumeValue.textContent = e.target.value; pauseVolumeSlider.value = e.target.value; pauseVolumeValue.textContent = e.target.value; saveAllSettings(); });
      fruitSelect.addEventListener('change', (e) => { fruitType = parseInt(e.target.value, 10); pauseFruitSelect.value = fruitType; drawBoard(); saveAllSettings(); });
      fieldDesignSelect.addEventListener('change', (e) => { fieldDesign = parseInt(e.target.value, 10); pauseFieldDesignSelect.value = fieldDesign; drawBoard(); saveAllSettings(); });
      customBgInput.addEventListener('change', (e) => { const f = e.target.files[0]; if (f) { const r = new FileReader(); r.onload = function(ev) { const img = new Image(); img.onload = function() { customBgImage = img; if (fieldDesign === 4) drawBoard(); }; img.src = ev.target.result; }; r.readAsDataURL(f); } });
      gridSizeSelect.addEventListener('change', () => { applyGridSize(); });
      languageSelect.addEventListener('change', (e) => { currentLang = e.target.value; pauseLanguageSelect.value = currentLang; updateUILanguage(); drawBoard(); saveAllSettings(); });
      saveNicknameBtn.addEventListener('click', saveNickname);
      nicknameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') saveNickname(); });

      pauseSnakeStyleSelect.addEventListener('change', (e) => { snakeStyle = parseInt(e.target.value, 10); snakeStyleSelect.value = snakeStyle; drawBoard(); saveAllSettings(); });
      pauseSoundSelect.addEventListener('change', (e) => { currentSoundType = parseInt(e.target.value, 10); soundSelect.value = currentSoundType; saveAllSettings(); });
      pausePreviewSound.addEventListener('click', () => { initAudio(); playAppleSound(); });
      pauseVolumeSlider.addEventListener('input', (e) => { soundVolume = parseInt(e.target.value, 10)/100; pauseVolumeValue.textContent = e.target.value; volumeSlider.value = e.target.value; volumeValue.textContent = e.target.value; saveAllSettings(); });
      pauseFruitSelect.addEventListener('change', (e) => { fruitType = parseInt(e.target.value, 10); fruitSelect.value = fruitType; drawBoard(); saveAllSettings(); });
      pauseFieldDesignSelect.addEventListener('change', (e) => { fieldDesign = parseInt(e.target.value, 10); fieldDesignSelect.value = fieldDesign; drawBoard(); saveAllSettings(); });
      pauseCustomBgInput.addEventListener('change', (e) => { const f = e.target.files[0]; if (f) { const r = new FileReader(); r.onload = function(ev) { const img = new Image(); img.onload = function() { customBgImage = img; if (fieldDesign === 4) drawBoard(); }; img.src = ev.target.result; }; r.readAsDataURL(f); } });
      pauseGridSizeSelect.addEventListener('change', () => { GRID_SIZE = parseInt(pauseGridSizeSelect.value, 10); gridSizeSelect.value = GRID_SIZE; applyGridSize(); });
      pauseLanguageSelect.addEventListener('change', (e) => { currentLang = e.target.value; languageSelect.value = currentLang; updateUILanguage(); drawBoard(); saveAllSettings(); });
      pauseSaveNicknameBtn.addEventListener('click', () => { const ta = document.activeElement; pauseNicknameInput.focus(); saveNickname(); if (ta) ta.focus(); });
      pauseNicknameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') saveNickname(); });

      document.querySelectorAll('.leaderboard-tab').forEach(tab => {
        tab.addEventListener('click', () => { currentLeaderboardSize = tab.dataset.size; updateLeaderboardUI(); });
      });
      pauseOverlay.addEventListener('click', () => { if (isPaused && pauseMenu.classList.contains('hidden')) togglePause(); });
    }

    function initialStart() {
      loadHighScore();
      const ss = loadSettings(), ms = { ...defaultSettings, ...ss };
      GRID_SIZE = ms.gridSize; CELL_SIZE = canvas.width / GRID_SIZE; currentLeaderboardSize = GRID_SIZE.toString();
      snakeColor = ms.snakeColor; snakeColorPicker.value = snakeColor;
      snakeStyle = ms.snakeStyle !== undefined ? ms.snakeStyle : 0;
      snakeStyleSelect.value = snakeStyle;
      fieldDesign = ms.fieldDesign; fieldDesignSelect.value = fieldDesign;
      fruitType = ms.fruitType; fruitSelect.value = fruitType;
      currentSoundType = ms.soundType; soundSelect.value = currentSoundType;
      soundVolume = ms.volume / 100; volumeSlider.value = ms.volume; volumeValue.textContent = ms.volume;
      currentLang = ms.language; languageSelect.value = currentLang;
      playerNickname = ms.nickname || '';
      snake = getInitSnake(); prevSnake = snake.map(s => ({...s}));
      bindEvents(); updateUILanguage(); updateNicknameDisplay();
      animationProgress = 1; drawBoard(); gameActive = false; showMainMenu();
      saveAllSettings();
      startCloudSync();
    }

    window.addEventListener('beforeunload', () => { clearGameLoop(); saveAllSettings(); });
    initialStart();
  })();
</script>
</body>
</html>
